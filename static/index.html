<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动物园谱系与繁育协调</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 820px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    button { padding: .5rem .8rem; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <h1>动物园谱系与繁育协调</h1>
  <p>这是最小演示页面。使用浏览器或 curl 调用 JSON API。</p>
  <p><button onclick="checkHealth()">检查服务状态</button></p>
  <pre id="result">等待操作</pre>
  <h2>血缘贡献台账</h2>
  <p>按奠基个体在存活个体中的血缘占比排序；隔离或已去世个体照常列出，但不能进入新配对建议。</p>
  <p><button onclick="loadLedger()">刷新台账</button> <span id="ledger-summary"></span></p>
  <div id="ledger"></div>
  <h2>常用接口</h2>
  <pre>GET  /health
GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
GET  /api/founder-ledger</pre>
</main>
<script>
async function checkHealth() {
  const response = await fetch('/health');
  document.getElementById('result').textContent = JSON.stringify(await response.json(), null, 2);
}

const STATUS_LABELS = { active: '在养', quarantined: '隔离', deceased: '已去世' };

function pct(value) {
  return (value * 100).toFixed(1) + '%';
}

async function loadLedger() {
  const response = await fetch('/api/founder-ledger');
  const data = await response.json();
  document.getElementById('ledger-summary').textContent =
    '个体总数 ' + data.animal_total + '，存活个体 ' + data.living_total;
  const container = document.getElementById('ledger');
  container.textContent = '';
  for (const founder of data.founders) {
    const section = document.createElement('section');
    const title = document.createElement('h3');
    title.textContent = (founder.name || founder.founder_id) +
      ' — 占比 ' + pct(founder.share) +
      '（' + (STATUS_LABELS[founder.status] || founder.status) + '）';
    section.appendChild(title);
    const list = document.createElement('ul');
    for (const carrier of founder.carriers) {
      const item = document.createElement('li');
      item.textContent = (carrier.name || carrier.animal_id) +
        ' — 携带 ' + pct(carrier.contribution) +
        '（' + (STATUS_LABELS[carrier.status] || carrier.status) + '）';
      list.appendChild(item);
    }
    section.appendChild(list);
    container.appendChild(section);
  }
  if (!data.founders.length) {
    container.textContent = '暂无奠基个体。';
  }
}
</script>
</body>
</html>
